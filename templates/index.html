<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <script>
        function RunSentimentAnalysis() {
            // Get the text from the input box
            let textToAnalyze = document.getElementById("textToAnalyze").value;

            // Call the Flask endpoint
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    // Display the response from server.py
                    document.getElementById("system_response").innerHTML = xhttp.responseText;
                }
            };
            xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze), true);
            xhttp.send();
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h2>Emotion Detection Analyzer</h2>
    <p>Enter a statement below to analyze its emotional tone:</p>
    
    <textarea id="textToAnalyze" rows="4" cols="50" placeholder="Type your sentence here..."></textarea>
    <br><br>
    
    <button onclick="RunSentimentAnalysis()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Analyze Emotion
    </button>
    <br><br>
    
    <div id="system_response" style="font-weight: bold; color: #333; max-width: 600px; margin: 0 auto;"></div>
</body>
</html>
